openapi: 3.0.3
info:
  title: Event Management API — Ferris Wheel Venue
  version: 1.0.0
  description: Reconstructed API contract for coordinating VIP events at a Ferris Wheel venue. The portfolio
    README and HTML describe the business scope; fields and examples not explicitly present in those materials
    are proposed assumptions to validate. This is an API specification, not a running backend.
  x-reconstruction-notes:
  - Reconstructed from the portfolio README and published HTML page; not guaranteed to match a lost original
    file.
  - Request/response fields, example values, staff role enum, and some error codes are proposed design
    choices.
  - The server URL is a placeholder. This file defines a contract and does not implement a backend.
  - The portfolio lists 5 + 2 + 2 + 2 + 2 operations, which totals 13 operations (not 12).
servers:
- url: https://api.example.com/v1
  description: Placeholder only — replace with the actual API base URL if a backend is implemented.
tags:
- name: Events
  description: Create and manage event bookings through their lifecycle.
- name: Cabins
  description: Check availability and assign VIP cabins to events.
- name: Services
  description: Manage catering, decoration, photo, video, and equipment services.
- name: Staff
  description: Assign staff members to events.
- name: Schedule
  description: View daily schedules and detect scheduling conflicts.
paths:
  /events:
    get:
      tags:
      - Events
      summary: List events for a date
      description: Returns events scheduled for the requested date.
      parameters:
      - $ref: '#/components/parameters/DateQuery'
      responses:
        '200':
          description: Events returned successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventSummary'
                  total:
                    type: integer
                    minimum: 0
              example:
                items:
                - &id002
                  eventId: evt-1042
                  title: VIP wedding ceremony
                  date: '2026-11-14'
                  startTime: '16:00:00'
                  endTime: '17:30:00'
                  guestCount: 24
                  status: CONFIRMED
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Events
      summary: Create an event booking
      description: 'Creates a booking in DRAFT status. Proposed business rule: validate that the start
        time is earlier than the end time and guest count is positive. Whether a cabin must be assigned
        at creation time is not specified in the portfolio materials.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Draft event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              example: &id001
                eventId: evt-1042
                title: VIP wedding ceremony
                date: '2026-11-14'
                startTime: '16:00:00'
                endTime: '17:30:00'
                guestCount: 24
                status: CONFIRMED
                clientName: Anna Petrova
                clientContact: anna@example.com
                notes: Coordinate wheel launch with engineering team.
                cabin:
                  cabinId: cabin-vip-02
                  name: VIP Cabin 02
                  capacity: 30
                  isVip: true
                services: []
                staff: []
                createdAt: '2026-10-18T10:00:00Z'
                updatedAt: '2026-10-18T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
  /events/{eventId}:
    parameters:
    - $ref: '#/components/parameters/EventId'
    get:
      tags:
      - Events
      summary: Get event details
      description: Returns event details, including assigned services and staff.
      responses:
        '200':
          description: Event found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              example: *id001
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Events
      summary: Partially update an event
      description: Updates editable fields such as time, guest count, or notes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              example: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /events/{eventId}/status:
    parameters:
    - $ref: '#/components/parameters/EventId'
    patch:
      tags:
      - Events
      summary: Change event status
      description: 'Proposed allowed transitions: DRAFT → CONFIRMED; CONFIRMED → IN_PROGRESS or CANCELLED;
        IN_PROGRESS → COMPLETED. Other transitions should return 409. Confirm the transition matrix with
        business stakeholders.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  $ref: '#/components/schemas/EventStatus'
                cancellationReason:
                  type: string
                  maxLength: 500
                  description: Required by business rule when cancelling, if applicable.
      responses:
        '200':
          description: Status changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              example: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Requested status transition is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /cabins:
    get:
      tags:
      - Cabins
      summary: Find available cabins
      description: Returns cabins available for a time interval.
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: startTime
        in: query
        required: true
        schema:
          type: string
          format: time
        description: Local venue start time.
      - name: durationMinutes
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Available cabins returned.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cabin'
        '400':
          $ref: '#/components/responses/BadRequest'
  /events/{eventId}/cabin:
    parameters:
    - $ref: '#/components/parameters/EventId'
    put:
      tags:
      - Cabins
      summary: Assign a cabin to an event
      description: Assigns a cabin if it is available for the event's time slot. The service should check
        for overlapping bookings and return 409 Conflict if the cabin is already booked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cabinId
              properties:
                cabinId:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Cabin assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              example: *id001
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cabin is already booked for an overlapping time slot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: &id004
                code: CABIN_ALREADY_BOOKED
                message: The selected cabin is not available for this time slot.
                details:
                - field: cabinId
                  issue: Overlaps with event evt-1043.
        '422':
          $ref: '#/components/responses/ValidationError'
  /events/{eventId}/services:
    parameters:
    - $ref: '#/components/parameters/EventId'
    get:
      tags:
      - Services
      summary: List event services
      responses:
        '200':
          description: Services returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventService'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Services
      summary: Add a service to an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventService'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /events/{eventId}/staff:
    parameters:
    - $ref: '#/components/parameters/EventId'
    get:
      tags:
      - Staff
      summary: List staff assigned to an event
      responses:
        '200':
          description: Staff assignments returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAssignment'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Staff
      summary: Assign a staff member to an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffAssignmentRequest'
      responses:
        '201':
          description: Staff member assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAssignment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Staff member has an overlapping assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /schedule/{date}:
    parameters:
    - name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    get:
      tags:
      - Schedule
      summary: Get daily schedule
      description: Returns the day's event timeline and operational milestones.
      responses:
        '200':
          description: Schedule returned.
          content:
            application/json:
              schema:
                type: object
                required:
                - date
                - items
                properties:
                  date:
                    type: string
                    format: date
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleItem'
        '400':
          $ref: '#/components/responses/BadRequest'
  /schedule/{date}/conflicts:
    parameters:
    - name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    get:
      tags:
      - Schedule
      summary: Detect scheduling conflicts
      description: Checks for (1) overlapping bookings for the same cabin, (2) overlapping assignments
        for the same staff member, and (3) insufficient gaps between operational activities. The exact
        minimum gap and whether cancelled/draft events are excluded must be agreed with business stakeholders.
      responses:
        '200':
          description: Conflict check completed.
          content:
            application/json:
              schema:
                type: object
                required:
                - date
                - hasConflicts
                - items
                properties:
                  date:
                    type: string
                    format: date
                  hasConflicts:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleConflict'
              example:
                date: '2026-11-14'
                hasConflicts: true
                items:
                - &id003
                  type: CABIN_OVERLAP
                  description: VIP Cabin 02 is assigned to two events during overlapping time slots.
                  eventIds:
                  - evt-1042
                  - evt-1043
                  resourceId: cabin-vip-02
                  startDateTime: '2026-11-14T16:00:00'
                  endDateTime: '2026-11-14T16:30:00'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: Unique event identifier.
      schema:
        type: string
        minLength: 1
    DateQuery:
      name: date
      in: query
      required: true
      description: Venue-local date to list.
      schema:
        type: string
        format: date
  schemas:
    EventStatus:
      type: string
      enum:
      - DRAFT
      - CONFIRMED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
    EventSummary:
      type: object
      required:
      - eventId
      - title
      - date
      - startTime
      - endTime
      - status
      properties:
        eventId:
          type: string
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        guestCount:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/EventStatus'
      example: *id002
    Event:
      allOf:
      - $ref: '#/components/schemas/EventSummary'
      - type: object
        properties:
          clientName:
            type: string
          clientContact:
            type: string
          notes:
            type: string
          cabin:
            $ref: '#/components/schemas/Cabin'
          services:
            type: array
            items:
              $ref: '#/components/schemas/EventService'
          staff:
            type: array
            items:
              $ref: '#/components/schemas/StaffAssignment'
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
      example: *id001
    CreateEventRequest:
      type: object
      required:
      - title
      - clientName
      - date
      - startTime
      - endTime
      - guestCount
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        clientName:
          type: string
          minLength: 1
          maxLength: 200
        clientContact:
          type: string
          maxLength: 200
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        guestCount:
          type: integer
          minimum: 1
        notes:
          type: string
          maxLength: 2000
      example:
        title: VIP wedding ceremony
        clientName: Anna Petrova
        clientContact: anna@example.com
        date: '2026-11-14'
        startTime: '16:00:00'
        endTime: '17:30:00'
        guestCount: 24
        notes: Coordinate wheel launch with engineering team.
    UpdateEventRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        guestCount:
          type: integer
          minimum: 1
        notes:
          type: string
          maxLength: 2000
      example:
        startTime: '16:15:00'
        guestCount: 26
        notes: Two additional guests confirmed.
    Cabin:
      type: object
      required:
      - cabinId
      - name
      properties:
        cabinId:
          type: string
        name:
          type: string
        capacity:
          type: integer
          minimum: 1
        isVip:
          type: boolean
      example:
        cabinId: cabin-vip-02
        name: VIP Cabin 02
        capacity: 30
        isVip: true
    ServiceType:
      type: string
      enum:
      - CATERING
      - DECORATION
      - PHOTO
      - VIDEO
      - EQUIPMENT
    EventService:
      type: object
      required:
      - serviceId
      - type
      - description
      properties:
        serviceId:
          type: string
        type:
          $ref: '#/components/schemas/ServiceType'
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        notes:
          type: string
    CreateServiceRequest:
      type: object
      required:
      - type
      - description
      properties:
        type:
          $ref: '#/components/schemas/ServiceType'
        description:
          type: string
          minLength: 1
        scheduledAt:
          type: string
          format: date-time
        notes:
          type: string
      example:
        type: CATERING
        description: Welcome drinks and canapés for 24 guests
        scheduledAt: '2026-11-14T15:30:00'
        notes: Confirm final guest count one day before event.
    StaffRole:
      type: string
      enum:
      - GUEST_MANAGER
      - DECORATOR
      - PHOTOGRAPHER
      - VIDEOGRAPHER
      - ENGINEER
      - OTHER
    StaffAssignment:
      type: object
      required:
      - assignmentId
      - staffMemberId
      - role
      properties:
        assignmentId:
          type: string
        staffMemberId:
          type: string
        staffName:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'
        briefingTime:
          type: string
          format: date-time
        notes:
          type: string
    CreateStaffAssignmentRequest:
      type: object
      required:
      - staffMemberId
      - role
      properties:
        staffMemberId:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/StaffRole'
        briefingTime:
          type: string
          format: date-time
        notes:
          type: string
      example:
        staffMemberId: staff-018
        role: ENGINEER
        briefingTime: '2026-11-14T15:15:00'
        notes: Confirm wheel launch window.
    ScheduleItem:
      type: object
      required:
      - eventId
      - title
      - startDateTime
      - endDateTime
      - status
      properties:
        eventId:
          type: string
        title:
          type: string
        activity:
          type: string
          description: Operational milestone such as decoration, guest arrival, or wheel launch.
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatus'
    ScheduleConflict:
      type: object
      required:
      - type
      - description
      - eventIds
      properties:
        type:
          type: string
          enum:
          - CABIN_OVERLAP
          - STAFF_DOUBLE_BOOKING
          - INSUFFICIENT_TIME_GAP
          - OTHER
        description:
          type: string
        eventIds:
          type: array
          items:
            type: string
        resourceId:
          type: string
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
      example: *id003
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
      example: *id004
  responses:
    BadRequest:
      description: Request parameters are missing or malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request data failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
